<!doctype html><html lang="es"><meta charset="utf-8"><title>Comprobación visual de Melodías AAC</title><style>body{background:#242424;color:#f3e9d5;font:16px system-ui;margin:24px}button{padding:10px}#score{background:white;color:black;margin-top:20px;width:1000px}pre{white-space:pre-wrap}</style><h1>Comprobación de lectura y dibujo de Melodías</h1><p>Abre y dibuja cada MusicXML con el mismo motor de AAC. No modifica las partituras.</p><button id="run">Comprobar biblioteca completa</button><p id="status" role="status">Preparado</p><pre id="errors"></pre><pre id="result"></pre><div id="score"></div><script src="../../../shared/opensheetmusicdisplay-1.8.4.min.js"></script><script>
const status=document.getElementById('status'),errors=document.getElementById('errors'),result=document.getElementById('result'),button=document.getElementById('run');button.onclick=async()=>{button.disabled=true;const report={checked:0,total:0,errors:[]},entries=(await(await fetch('../Melodías/catalog.json?audit='+Date.now(),{cache:'no-store'})).json()).examples;report.total=entries.length;const osmd=new opensheetmusicdisplay.OpenSheetMusicDisplay(document.getElementById('score'),{backend:'svg',autoResize:false,drawingParameters:'compacttight',drawTitle:true});for(const entry of entries){status.textContent=`${report.checked} / ${report.total} · ${entry.title}`;try{const response=await fetch('../'+entry.musicxml);if(!response.ok)throw Error('HTTP '+response.status);await osmd.load(await response.text());osmd.render();if(!document.querySelector('#score svg'))throw Error('No se dibujó el pentagrama');}catch(e){report.errors.push({id:entry.id,title:entry.title,error:e.message});errors.textContent=JSON.stringify(report.errors,null,2);}report.checked++;result.textContent=JSON.stringify(report);}status.textContent=`Finalizado: ${report.checked} partituras · ${report.errors.length} errores`;button.disabled=false;};
</script></html>
