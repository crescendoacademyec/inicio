<script>
(async()=>{
 const results=[],assert=(ok,message)=>{if(!ok)throw Error(message);},same=(a,b,message)=>assert(JSON.stringify(a)===JSON.stringify(b),message+': '+JSON.stringify(a));
 const source=await (await fetch('../herramientas/editor-crescendo/src/app.js')).text();
 function fn(name){const start=source.indexOf('  function '+name+'(');assert(start>=0,'Missing function '+name);let i=source.indexOf('{',start)+1,depth=1;for(;depth;i++){if(source[i]==='{')depth++;if(source[i]==='}')depth--;}return source.slice(start,i);}
 // Isolate the production importer from the editor UI. Helpers below only supply
 // native document objects and editor-entry construction, not import decisions.
 let id=0;const durations={breve:32,whole:16,half:8,quarter:4,eighth:2,sixteenth:1,'thirty-second':.5,'sixty-fourth':.25,'one-twenty-eighth':.125};
 const context={window,DOMParser,MUSICXML_STEP_NAMES:["C","D","E","F","G","A","B"],DEFAULT_METER:{top:4,bottom:4},DEFAULT_CLEF_ID:'clef-g',EPSILON:.0001,
  KeySignatures:{parse:tonic=>({tonic})},durationById:id=>({id,ticks:durations[id]||4}),normalizeMeter:m=>m,
  staffStepForDiatonicStep:d=>-d,accidentalBySemitone:a=>({'-2':'double-flat','-1':'flat',0:'natural',1:'sharp',2:'double-sharp'}[a]),
  musicXmlDurationInfo:(ticks,durationId,dots)=>({durationId,dots}),makeEntry:(type,d)=>({id:'n'+(++id),type,ticks:d.ticks,voice:1}),
  makeRestEntriesForRange:(tick,ticks)=>ticks>0?[{id:'r'+(++id),type:'rest',tickStart:tick,ticks}]:[],
  setEntryVoice:(e,voice)=>({...e,voice}),entryVoice:e=>e.voice||1,createTupletGroupId:()=>String(++id),applyTupletMetadata:(e,t)=>{e.tuplet=t;}};
 const constants=['TYPE_TO_DURATION_ID','FIFTHS_MAJOR','FIFTHS_MINOR','HARMONY_SUFFIX'].map(name=>{const start=source.indexOf('  const MUSICXML_IMPORT_'+name+' =');return source.slice(start,source.indexOf('});',start)+3);}).join('\n');
 const names=['xmlChildren','xmlFirstChild','xmlNumberContent','musicXmlImportKeySignature','musicXmlImportClefId','musicXmlImportDiatonicStep','musicXmlImportDirections','musicXmlImportChordText','musicXmlImportNoteElement','parseMusicXmlScoreDocument'];
 const parse=new Function(...Object.keys(context),constants+'\n'+names.map(fn).join('\n')+'\nreturn parseMusicXmlScoreDocument;')(...Object.values(context));
 const wrap=measures=>`<score-partwise version="4.0"><part-list><score-part id="P1"><part-name>Test</part-name></score-part></part-list><part id="P1">${measures}</part></score-partwise>`;
 const attributes='<attributes><divisions>4</divisions><key><fifths>1</fifths></key><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>';
 const note=(step='G',duration=16,extra='')=>`<note>${extra}<pitch><step>${step}</step><alter>0</alter><octave>4</octave></pitch><duration>${duration}</duration><type>whole</type></note>`;
 const pickup=wrap(`<measure number="0" implicit="yes">${attributes}<direction><direction-type><metronome><beat-unit>quarter</beat-unit><per-minute>132</per-minute></metronome></direction-type></direction><harmony><root><root-step>C</root-step></root><kind>dominant</kind><degree><degree-value>9</degree-value><degree-alter>-1</degree-alter><degree-type>alter</degree-type></degree><bass><bass-step>F</bass-step><bass-alter>1</bass-alter></bass></harmony><note><grace slash="no"/><pitch><step>F</step><alter>1</alter><octave>4</octave></pitch><type>eighth</type></note>${note('G',2)}</measure><measure number="1">${note()}</measure>`);
 async function test(name,run){try{await run();results.push({name,ok:true});}catch(e){results.push({name,ok:false,error:e.stack||e.message});}}
 await test('Crescendo: pickup, grace spelling, tempo and altered slash chord survive import',()=>{const p=parse(pickup);same(p.systemsData[0].measures[0].actualTicks,2,'Pickup ticks');same(p.systemsData[0].measures[0].entries.length,1,'No invented pickup rests');assert(p.scoreMarksOut.some(m=>m.kind==='tempo'&&m.bpm===132),'tempo');assert(p.scoreMarksOut.some(m=>m.kind==='grace-note'&&m.accidental==='sharp'&&m.slash===false),'Grace pitch');same(p.textItemsOut.find(m=>m.kind==='chord').text,'C7(b9)/F#','Chord');});
 await test('Crescendo: four simultaneous voices remain independent',()=>{const xml=wrap(`<measure number="1">${attributes}${[1,2,3,4].map((v,i)=>(i?'<backup><duration>16</duration></backup>':'')+note('C',16,`<voice>${v}</voice>`)).join('')}</measure>`);same(parse(xml).systemsData[0].measures[0].entries.map(e=>e.voice),[1,2,3,4],'Voices');});
 await test('Metronome: pickup round-trip and natural pitch inside sharp key signature',()=>{const p=CrescendoRhythmImport.parse(pickup),t=CrescendoRhythmStructure.timeline('4/4',p.marks,p.bars);same(t.starts,[0,.5,4.5],'Timeline');assert(p.marks.some(m=>m.type==='chord'&&m.text==='C7(b9)/F#'),'Chord');const xml=CrescendoRhythmExport.musicXML(p.events,{bars:p.bars,marks:p.marks,writing:CrescendoRhythmWriting});const again=CrescendoRhythmImport.parse(xml);same(CrescendoRhythmStructure.timeline('4/4',again.marks,again.bars).starts,t.starts,'Round trip pickup');same(CrescendoRhythmStructure.resolve(again.events,again.marks).filter(e=>e.kind!=='rest').map(e=>e.note),['F#4','G4','G4'],'Pitches');});
 await test('Metronome: import and render a complete 32-bar standard',()=>{const p=CrescendoRhythmImport.parse(wrap(Array.from({length:32},(_,i)=>`<measure number="${i+1}">${i?'':attributes}${note()}</measure>`).join('')));same(p.bars,32,'Bar count');assert(CrescendoRhythmWriting.render(p.events,{bars:32,marks:p.marks}).includes('data-bar="31"'),'Last bar rendered');});
 await test('Metronome: casillas and repeat count survive export/import',()=>{const xml=wrap(`<measure number="1">${attributes}<barline location="left"><repeat direction="forward"/></barline>${note()}</measure><measure number="2"><barline location="left"><ending number="1,2" type="start"/></barline>${note()}<barline location="right"><ending number="1,2" type="stop"/><repeat direction="backward" times="3"/></barline></measure><measure number="3">${note()}</measure>`);const p=CrescendoRhythmImport.parse(xml);same(CrescendoRhythmMarks.route(p.bars,p.marks),[0,1,0,1,0,2],'Three passes');const again=CrescendoRhythmImport.parse(CrescendoRhythmExport.musicXML(p.events,{bars:3,marks:p.marks,writing:CrescendoRhythmWriting}));same(CrescendoRhythmMarks.route(again.bars,again.marks),[0,1,0,1,0,2],'Round-trip route');});
 await test('Directions: offsets, dynamics and D.S. al Coda retain their semantics',()=>{const doc=new DOMParser().parseFromString('<direction><direction-type><words>D.S. al Coda</words><dynamics><mf/></dynamics></direction-type><offset>2</offset><sound dalsegno="segno"/></direction>','application/xml');const d=CrescendoScoreImportDetails.directions(doc.documentElement,4,4,4);assert(d.some(m=>m.kind==='navigation'&&m.navigation==='dsCoda'&&m.tick===6),'D.S. offset');assert(d.some(m=>m.kind==='dynamic'&&m.text==='mf'),'Dynamics');});
 await test('Metronome: D.S., Coda and Fine preserve their identifiers on round trip',()=>{const xml=wrap(['<direction><direction-type><segno/></direction-type><sound segno="segno"/></direction>','<direction><direction-type><words>D.S. al Coda</words></direction-type><sound dalsegno="segno"/></direction>','<direction><direction-type><coda/></direction-type><sound coda="coda"/></direction>','<direction><direction-type><words>Fine</words></direction-type><sound fine="yes"/></direction>'].map((d,i)=>`<measure number="${i+1}">${i?'':attributes}${d}${note()}</measure>`).join(''));const p=CrescendoRhythmImport.parse(xml),again=CrescendoRhythmImport.parse(CrescendoRhythmExport.musicXML(p.events,{bars:p.bars,marks:p.marks,writing:CrescendoRhythmWriting}));same(again.marks.filter(m=>['segno','dsCoda','coda','fine'].includes(m.type)).map(m=>m.type),['segno','dsCoda','coda','fine'],'Navigation marks');});
 await test('Crescendo: incomplete measures export explicitly without padded rests',()=>{const p=parse(pickup),readTicks=new Function('state','Meter','meterForMeasureIndex',fn('measureTicksForIndex')+';return measureTicksForIndex;')({systems:p.systemsData},{measureTicks:()=>16},()=>({top:4,bottom:4}));same(readTicks(0),2,'Pickup playback capacity');same(readTicks(1),16,'Normal playback capacity');});
 await test('File APIs: naming, MEI and compressed MusicXML share the same namespace',async()=>{assert(typeof CrescendoScoreFile.ask==='function','Save dialog retained');assert(typeof CrescendoScoreFile.readXml==='function','Reader retained');const zip=new JSZip();zip.file('META-INF/container.xml','<container><rootfiles><rootfile full-path="score.musicxml"/></rootfiles></container>');zip.file('score.musicxml',wrap(`<measure number="1">${attributes}${note()}</measure>`));const file=new File([await zip.generateAsync({type:'uint8array'})],'example.mxl');const result=await CrescendoScoreFile.readXml(file);same(parse(result.content).measureCount,1,'MXL content');});
 await test('Crescendo: explicit route exports in a single valid identification element',()=>{const xml=JMLScoreMusicXml.serialize({title:'Expansion',divisions:480,importedRoute:[0,1,0],measures:[0,1].map(i=>({number:i+1,ticks:16,staves:[]}))});const doc=new DOMParser().parseFromString(xml,'application/xml');same(doc.querySelectorAll('identification').length,1,'Single identification');same(CrescendoScoreRoute.fromElement(doc.documentElement),[0,1,0],'Exported route');});
 await test('Both editors: source system breaks are imported without losing notes',()=>{const xml=wrap(Array.from({length:8},(_,i)=>`<measure number="${i+1}">${i?'':attributes}${[2,5].includes(i)?'<print new-system="yes"/>':''}${note()}</measure>`).join('')),p=parse(xml),m=CrescendoRhythmImport.parse(xml);same(p.systemBreaks,[2,5],'Crescendo source systems');same(m.marks.find(x=>x.type==='systemLayout').breaks,[2,5],'Metronome source systems');same(m.events.filter(e=>e.kind!=='rest').length,8,'All notes');const host=document.createElement('div');host.innerHTML=CrescendoRhythmWriting.render(m.events,{bars:m.bars,marks:m.marks});same(host.querySelector('svg').dataset.systemStarts,'0,2,5','Rendered rows');});
 await test('Both editors: explicit manual layout, including one system, survives MusicXML',()=>{for(const breaks of [[],[2,5]]){const measures=Array.from({length:8},(_,i)=>({number:i+1,ticks:16,newSystem:breaks.includes(i),staves:[]})),xml=JMLScoreMusicXml.serialize({title:'Systems',systemBreaks:breaks,measures}),doc=new DOMParser().parseFromString(xml,'application/xml');same(parse(xml).systemBreaks,breaks,'Crescendo round trip');same(doc.querySelectorAll('print[new-system="yes"]').length,breaks.length,'Standard print hints');const m=CrescendoRhythmImport.parse(xml),again=CrescendoRhythmImport.parse(CrescendoRhythmExport.musicXML(m.events,{bars:m.bars,marks:m.marks,writing:CrescendoRhythmWriting}));same(again.marks.find(x=>x.type==='systemLayout').breaks,breaks,'Metronome round trip');}});
 await test('Both editors: title and independent composer/transcriber credits survive MusicXML',()=>{const creators=[{type:'composer',name:'José & Ana'},{type:'transcriber',name:'María <Pérez>'}],title='Estudio & melodía',xml=JMLScoreMusicXml.serialize({title,creators,systemBreaks:[],measures:[{number:1,ticks:16,staves:[]}]}),p=parse(xml),m=CrescendoRhythmImport.parse(xml);same(p.title,title,'Native title');same(p.creators,creators,'Native credits');same(m.creators,creators,'Metronome credits');const again=CrescendoRhythmImport.parse(CrescendoRhythmExport.musicXML(m.events,{title:m.title,creators:m.creators,bars:1,marks:m.marks,writing:CrescendoRhythmWriting}));same(again.creators,creators,'Metronome exported credits');same(again.title,title,'Metronome exported title');});
 await test('Score heading: title/credit clicks never write notes, and image headings retain literal text',()=>{const host=document.createElement('div');let writes=0;host.addEventListener('click',()=>writes++);const heading=CrescendoScoreHeading.update(host,{title:'Título <seguro>',creators:[{type:'transcriber',name:'Ana & José'}]});heading.querySelector('h2').click();same(writes,0,'Heading click is isolated from note entry');same(heading.querySelector('h2').textContent,'Título <seguro>','Literal title');const source=document.createElementNS('http://www.w3.org/2000/svg','svg');source.setAttribute('viewBox','0 0 900 300');const image=CrescendoScoreHeading.svg(source,{title:'Título <seguro>',creators:[{type:'transcriber',name:'Ana & José'}]});assert(Number(image.getAttribute('height'))>300,'Space reserved above notes');assert(image.textContent.includes('Transcripción: Ana & José'),'Image credit');});
 const catalog=await(await fetch('../herramientas/aac/Melodías/catalog.json')).json();
 for(const song of catalog.examples)await test('Library: '+song.title,async()=>{const xml=await(await fetch('../herramientas/aac/'+song.musicxml)).text(),doc=new DOMParser().parseFromString(xml,'application/xml'),part=doc.querySelector('score-partwise > part');if(song.title==='Ask Me Why'){for(const read of [parse,CrescendoRhythmImport.parse]){let error;try{read(xml);}catch(e){error=e;}assert(error&&/excede el compás 11/.test(error.message),'Overfilled source must be rejected before replacing the current score');}return;}const expected=part.querySelectorAll('note > pitch').length,p=parse(xml),count=p.systemsData.flatMap(s=>s.measures).flatMap(m=>m.entries).filter(e=>e.type==='note').reduce((n,e)=>n+(e.chordDiatonicSteps?.length||1),0)+p.scoreMarksOut.filter(m=>m.kind==='grace-note').length;same(count,expected,'All source notes imported');same(p.measureCount,part.querySelectorAll(':scope > measure').length,'All source bars imported');const voices=new Map();for(const n of part.querySelectorAll('note:not(:has(grace))')){const staff=n.querySelector('staff')?.textContent||'1';if(!voices.has(staff))voices.set(staff,new Set());voices.get(staff).add(n.querySelector('voice')?.textContent||'1');}if([...voices.values()].every(v=>v.size===1)){const m=CrescendoRhythmImport.parse(xml),count=m.events.filter(e=>e.kind!=='rest').reduce((n,e)=>n+(e.notes?.length||1),0);same(count,expected,'Metronome notes');}});
 for(const song of catalog.examples.filter(s=>s.sourceFormat==='mei'))await test('MEI: '+song.title,async()=>{const content=await(await fetch('../herramientas/aac/'+song.sourceFile)).text(),file=new File([content],song.sourceFile.split('/').at(-1)),loaded=await CrescendoScoreFile.readXml(file);if(song.title==='Ask Me Why'){let failed=false;try{parse(loaded.content);}catch(e){failed=/excede el compás 11/.test(e.message);}assert(failed,'Invalid MEI duration must be rejected');return;}const p=parse(loaded.content),meta=new DOMParser().parseFromString(loaded.content,'application/xml').querySelector('miscellaneous-field[name="crescendo:measure-route"]');assert(p.measureCount>0,'MEI notes opened');if(meta)same(p.importedRoute.route,JSON.parse(meta.textContent),'Native expansion');if(song.title==='Actual Proof'){let failed=false;try{CrescendoRhythmImport.parse(loaded.content);}catch(e){failed=/varias voces/.test(e.message);}assert(failed,'Multivoice MEI is explicitly rejected by the practice editor');return;}const m=CrescendoRhythmImport.parse(loaded.content),xml=CrescendoRhythmExport.musicXML(m.events,{bars:m.bars,marks:m.marks,clef:m.clef,writing:CrescendoRhythmWriting}),again=CrescendoRhythmImport.parse(xml);same(CrescendoRhythmMarks.route(again.bars,again.marks),CrescendoScoreRoute.fromElement(new DOMParser().parseFromString(loaded.content,'application/xml').documentElement),'MEI route round-trip');});
 document.getElementById('report').textContent=JSON.stringify({passed:results.filter(r=>r.ok).length,failed:results.filter(r=>!r.ok).length,results},null,2);
})().catch(e=>document.getElementById('report').textContent=JSON.stringify({fatal:e.stack}));
